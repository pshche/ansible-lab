---
- name: Install Grafana
  hosts: practicum_servers
  become: yes

  vars:
    grafana_version: 12.1.0
    grafana_deb_url: "https://dl.grafana.com/oss/release/grafana_{{ grafana_version }}_amd64.deb"

  tasks:
    - name: Ensure OS is Debian-based
      fail:
        msg: "Этот плейбук предназначен только для Debian-based систем. Текущая ОС: {{ ansible_os_family }}"
      when: ansible_os_family != "Debian"

    - name: Ensure ca-certificates is installed
      apt:
        name: ca-certificates
        state: present
        update_cache: yes

    # --- Проверка 1. Установлена ли Grafana ---
    - name: Check if Grafana is already installed
      stat:
        path: /usr/share/grafana/bin/grafana
      register: grafana_binary
      changed_when: false

    # --- Проверка 2. Доступен ли deb по ссылке ---
    - name: Check Grafana deb URL availability
      uri:
        url: "{{ grafana_deb_url }}"
        method: HEAD
        status_code: [200, 302]
      register: grafana_deb_check
      failed_when: false
      changed_when: false

    # --- Блок установки, только если проверки прошли ---
    - name: Install and start Grafana
      block:
        - name: Install Grafana package
          apt:
            deb: "{{ grafana_deb_url }}"
            update_cache: yes

        - name: Enable and start Grafana service (systemd hosts)
          systemd_service:
            name: grafana-server
            state: started
            enabled: yes
          when: ansible_service_mgr | default('') == "systemd"

        - name: Start Grafana (container-friendly, no systemd)
          shell: |
            pgrep grafana-server || nohup /usr/share/grafana/bin/grafana server \
              --config /etc/grafana/grafana.ini \
              --homepath /usr/share/grafana \
              > /var/log/grafana/grafana.log 2>&1 &
          args:
            executable: /bin/bash
          when: ansible_service_mgr | default('') != "systemd"
      when:
        - not grafana_binary.stat.exists
        - grafana_deb_check.status in [200, 302]