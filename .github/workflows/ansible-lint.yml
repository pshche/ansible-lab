name: Ansible Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Provide dummy vault password for linting
        run: |
          echo "dummy" > /tmp/vault_pass_for_lint
          echo "ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault_pass_for_lint" >> $GITHUB_ENV

      - name: Run ansible-playbook --syntax-check
        run: ansible-playbook playbook.yaml --syntax-check

      - name: Run ansible-lint
        run: ansible-lint playbook.yaml roles/

      - name: Run yamllint (optional)
        run: yamllint -c .yamllint playbook.yaml roles/ 2>/dev/null || true