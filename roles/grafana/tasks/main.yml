---
# tasks file for grafana

- name: Ensure ca-certificates is installed
  apt:
    name: ca-certificates
    state: present
    update_cache: yes

- name: Check if Grafana is already installed
  stat:
    path: /usr/share/grafana/bin/grafana
  register: grafana_binary
  changed_when: false

- name: Check Grafana deb URL availability
  uri:
    url: "{{ grafana_deb_url }}"
    method: HEAD
    status_code: [200, 302]
  register: grafana_deb_check
  failed_when: false
  changed_when: false

- name: Install Grafana package
  apt:
    deb: "{{ grafana_deb_url }}"
    update_cache: yes
  when:
    - not grafana_binary.stat.exists
    - grafana_deb_check.status in [200, 302]

# 1. Сначала конфиг
- name: Template Grafana config
  template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: '0640'
  notify: "grafana reload"

# 2. Потом запуск
- name: Ensure Grafana process is running (container-friendly)
  shell: |
    set -o pipefail
    if ! ss -ltn 2>/dev/null | grep -q ':3000'; then
      mkdir -p /var/log/grafana
      nohup /usr/share/grafana/bin/grafana server \
        --config /etc/grafana/grafana.ini \
        --homepath /usr/share/grafana \
        > /var/log/grafana/grafana.log 2>&1 &
      sleep 3
    fi
  args:
    executable: /bin/bash
  when: ansible_service_mgr | default('') != "systemd"
  changed_when: false

- name: Ensure Grafana provisioning dirs exist
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: grafana
    mode: '0755'
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards

- name: Template InfluxDB datasource
  template:
    src: datasource-influxdb.yaml.j2
    dest: /etc/grafana/provisioning/datasources/influxdb.yaml
    owner: root
    group: grafana
    mode: '0640'
  notify: "grafana reload"

- name: Flush handlers to restart Grafana now
  meta: flush_handlers

- name: Wait for Grafana to be ready
  uri:
    url: http://127.0.0.1:3000/api/health
    status_code: 200
  register: health
  until: health.status == 200
  retries: 20
  delay: 3
  changed_when: false