---
- name: Ensure OS is Debian-based
  fail:
    msg: "Этот плейбук предназначен только для Debian-based систем. Текущая ОС: {{ ansible_os_family }}"
  when: ansible_os_family != "Debian"

- name: Ensure ca-certificates is installed
  apt:
    name: ca-certificates
    state: present
    update_cache: yes

- name: Check if Grafana is already installed
  stat:
    path: /usr/share/grafana/bin/grafana
  register: grafana_binary
  changed_when: false

- name: Check Grafana deb URL availability
  uri:
    url: "{{ grafana_deb_url }}"
    method: HEAD
    status_code: [200, 302]
  register: grafana_deb_check
  failed_when: false
  changed_when: false

- name: Install Grafana package
  apt:
    deb: "{{ grafana_deb_url }}"
    update_cache: yes
  when:
    - not grafana_binary.stat.exists
    - grafana_deb_check.status in [200, 302]

# Запускаем процесс, если он ещё не работает (после установки или после
# пересоздания контейнера). На systemd-хостах это делает systemd_service
# в handler'е — отдельный таск не нужен.
- name: Ensure Grafana process is running (container-friendly)
  shell: |
    if ! pgrep -f grafana-server > /dev/null; then
      nohup /usr/share/grafana/bin/grafana server \
        --config /etc/grafana/grafana.ini \
        --homepath /usr/share/grafana \
        > /var/log/grafana/grafana.log 2>&1 &
      sleep 3
    fi
  args:
    executable: /bin/bash
  when: ansible_service_mgr | default('') != "systemd"
  changed_when: false

# Рендерим конфиг. Если изменился — notify "grafana reload",
# handler перезапустит сервис.
- name: Template Grafana config
  template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: '0640'
  notify: "grafana reload"

# Принудительно выполняем handler'ы СЕЙЧАС, а не в конце плея,
# чтобы следующая проверка health-check била уже в перезапущенную Grafana.
- name: Flush handlers to restart Grafana now
  meta: flush_handlers

# Health-check: ждём, пока Grafana ответит 200. Без него плеер может
# завершиться раньше, чем процесс поднимется.
- name: Wait for Grafana to be ready
  uri:
    url: http://localhost:3000/api/health
    status_code: 200
  register: health
  until: health.status == 200
  retries: 10
  delay: 2
  changed_when: false
