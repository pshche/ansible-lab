---
# handlers file for telegraf
---
- name: Restart Telegraf (systemd hosts)
  listen: "telegraf reload"
  systemd_service:
    name: telegraf
    state: restarted
    enabled: yes
  when: ansible_service_mgr | default('') == "systemd"

- name: Restart Telegraf (container-friendly, no systemd)
  listen: "telegraf reload"
  shell: |
    pkill telegraf || true
    sleep 1
    nohup /usr/bin/telegraf --config /etc/telegraf/telegraf.conf \
      > /var/log/telegraf.log 2>&1 &
  args:
    executable: /bin/bash
  when: ansible_service_mgr | default('') != "systemd"