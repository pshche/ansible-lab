---
- name: Install and configure monitoring stack
  hosts: practicum_servers
  become: yes
  vars_files:
    - secrets.yml
  pre_tasks:
    - name: Ensure OS is Debian-based
      fail:
        msg: "Только Debian-based. Текущая ОС: {{ ansible_os_family }}"
      when: ansible_os_family != "Debian"
  roles:
    - influxdb
    - telegraf
    - grafana

- name: Verify all services
  hosts: practicum_servers
  gather_facts: false
  vars_files:
    - secrets.yml
  vars:
    grafana_admin: admin
  tasks:
    - name: Check Grafana health
      uri:
        url: "http://127.0.0.1:3000/api/health"
        status_code: 200
      register: grafana_health
      failed_when: false
      changed_when: false

    - name: Check InfluxDB health
      uri:
        url: "http://127.0.0.1:8086/health"
        status_code: 200
      register: influx_health
      failed_when: false
      changed_when: false

    - name: Check InfluxDB setup status
      uri:
        url: "http://127.0.0.1:8086/api/v2/setup"
        method: GET
      register: influx_setup
      failed_when: false
      changed_when: false

    - name: Check Telegraf process
      command: pgrep -x telegraf
      register: telegraf_proc
      failed_when: false
      changed_when: false

    - name: Verify metrics are flowing into InfluxDB
      shell: |
        curl -s -XPOST "http://127.0.0.1:8086/api/v2/query?org={{ influx_org }}" \
          -H "Authorization: Token {{ influx_token }}" \
          -H "Content-Type: application/vnd.flux" \
          -H "Accept: application/csv" \
          --data 'from(bucket: "{{ influx_bucket }}") |> range(start: -10m) |> filter(fn: (r) => r._measurement == "cpu") |> limit(n: 1)' | grep -q ',cpu,'
      register: metrics_check
      until: metrics_check.rc == 0
      retries: 15
      delay: 2
      failed_when: false
      changed_when: false

    - name: Show verification results
      debug:
        msg:
          - "Grafana:    {{ 'OK' if grafana_health.status | default(0) == 200 else 'FAIL (' ~ (grafana_health.status | default('error')) ~ ')' }}  →  http://localhost:{{ grafana_local_port }}"
          - "InfluxDB:   {{ 'OK' if influx_health.status | default(0) == 200 else 'FAIL (' ~ (influx_health.status | default('error')) ~ ')' }}  →  http://localhost:{{ influx_local_port }}"
          - "Setup:      {{ 'OK' if (influx_setup.json is defined and influx_setup.json.allowed is defined and not influx_setup.json.allowed) else 'NOT DONE' }}"
          - "Metrics:    {{ 'OK (data flowing)' if metrics_check.rc is defined and metrics_check.rc == 0 else 'NO DATA in last 10m' }}"
          - "Telegraf:   {{ 'running (pid ' ~ telegraf_proc.stdout ~ ')' if telegraf_proc.rc == 0 else 'stopped' }}  →  InfluxDB :{{ influx_local_port }}"